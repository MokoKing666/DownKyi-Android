name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一个分支的新推送取消上一次未跑完的任务，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PUB_ENVIRONMENT: ci

jobs:
  check:
    name: 格式 / 分析 / 测试
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter 版本说明：
      #   本地开发用的是 master 快照（3.49.0-0.2.pre），预发布版在 CI 上无法可靠复现，
      #   这里跟随 stable。tdesign 的 IconData 兼容补丁在两种版本上都会正确执行
      #   （脚本先检测 `extends IconData` 再动手），所以不影响可构建性。
      #   如果将来需要严格锁定，改用 subosito/flutter-action 的 flutter-version 指定确切版本。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 拉依赖（此时还没有 pubspec_overrides.yaml，走的是官方 tdesign_flutter）
      - name: flutter pub get
        run: flutter pub get

      # 生成 third_party/tdesign_flutter 并写入 pubspec_overrides.yaml，
      # 让 tdesign_flutter 指向修补过的副本——脚本内部会再跑一次 pub get。
      # 详见 tools/prepare_tdesign.ps1 头部说明。
      - name: 准备修补过的 tdesign_flutter
        shell: pwsh
        run: ./tools/prepare_tdesign.ps1

      - name: dart format 检查
        run: dart format --output=none --set-exit-if-changed lib test

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test --reporter expanded

  # PR 上额外做一次依赖审查：新引入的依赖若有已知漏洞或危险许可证会直接拦下来。
  # 仅在 PR 上跑（push 到 main 时没有对比基线）。
  dependency-review:
    name: 依赖审查
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
