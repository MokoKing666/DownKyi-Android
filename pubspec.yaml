name: downkyi
description: 哔哩哔哩下载姬 Android 版 · DownKyi for Android（B 站视频下载工具）
publish_to: 'none'
version: 1.5.0+8

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # TDesign 官方 Flutter 组件库
  tdesign_flutter: ^0.2.7

  # 状态管理
  provider: ^6.1.0

  # 任务持久化
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

  # WBI 签名需要的 md5
  crypto: ^3.0.0

  # 登录二维码
  qr_flutter: ^4.1.0

  # FFmpeg（格式转换 / 转码 / 提取音频 / 生成 GIF）
  # ffmpeg-kit 上游已停止维护，这里用社区维护分支（API 与上游一致）
  ffmpeg_kit_flutter_new: ^4.6.7

  # 订阅的周期后台检查（WorkManager）
  workmanager: ^0.10.10

  # 订阅更新通知。
  # 不用自建 MethodChannel 的原因见 lib/subscription/notification_service.dart：
  # WorkManager 的后台 isolate 用的是它自己创建的 FlutterEngine，
  # 那里没有 MainActivity，自建通道拿不到 handler，通知会静默失败。
  flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
