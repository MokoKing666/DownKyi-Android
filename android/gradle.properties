# preferIPv4Stack：部分网络环境下 JVM 走 IPv6 会连接超时，强制 IPv4 更稳
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
# 以下两个开关由 Flutter 官方模板引入：关闭 AGP 9 的新 DSL 与内置 Kotlin，
# 保证 Flutter Gradle 插件与 KotlinAndroid 插件按传统方式工作。
android.newDsl=false
android.builtInKotlin=false
# 允许包含非 ASCII 字符的工程路径（Windows 下 AGP 默认会拒绝）
android.overridePathCheck=true
